name: redcloud_android
description: "RedCloud VPN - Multi-Core Android Client (V2Ray, Aether & Tor Engines)."
publish_to: 'none'

# نسخه جدید برنامه همراه با پایداری پس‌زمینه و رفع باگ‌های شبکه
version: 1.2.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_v2ray_client: ^3.3.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/DNS.txt
    - assets/cloudflare_IPs.txt

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/logo.png"