name: Build and Release RedCloud Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "[*] Releasing version: ${TAG_NAME}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup 32-bit and 64-bit Native Binaries
        run: |
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          
          echo "[*] Fetching 32-bit Aether binary..."
          curl -sL "https://github.com/CluvexStudio/Aether/releases/latest/download/aether-android-armv7.tar.gz" -o aether-armv7.tar.gz || true
          if [ -f aether-armv7.tar.gz ]; then
            tar -xzf aether-armv7.tar.gz -C android/app/src/main/jniLibs/armeabi-v7a/ 2>/dev/null || true
            [ -f android/app/src/main/jniLibs/armeabi-v7a/aether ] && mv android/app/src/main/jniLibs/armeabi-v7a/aether android/app/src/main/jniLibs/armeabi-v7a/libaether.so || true
            rm -f aether-armv7.tar.gz
          fi

          echo "[*] Fetching Tor GeoIP databases..."
          mkdir -p assets/tor
          curl -sL "https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip" -o assets/tor/geoip
          curl -sL "https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip6" -o assets/tor/geoip6
          ls -la android/app/src/main/jniLibs/

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: |
          echo "[*] Building Universal APK..."
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p release_apks
          VERSION_TAG="${{ steps.get_version.outputs.VERSION }}"
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/RedCloud-${VERSION_TAG}-Universal.apk

      - name: Build ABI-Split APKs
        run: |
          echo "[*] Building Split-per-ABI APKs..."
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          VERSION_TAG="${{ steps.get_version.outputs.VERSION }}"
          
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/RedCloud-${VERSION_TAG}-arm64-v8a.apk || true
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/RedCloud-${VERSION_TAG}-armeabi-v7a.apk || true

      - name: Generate Checksums
        run: |
          cd release_apks
          sha256sum *.apk > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "RedCloud VPN ${{ steps.get_version.outputs.VERSION }}"
          files: |
            release_apks/*.apk
            release_apks/SHA256SUMS.txt
          body: |
            ## 🛡️ انتشار نسخه پایدار RedCloud VPN (${{ steps.get_version.outputs.VERSION }})
            
            ### 📥 راهنمای فایل‌های دانلود:
            * 📱 **RedCloud-${{ steps.get_version.outputs.VERSION }}-Universal.apk** : نسخه پیشنهادی (سازگار با تمامی گوشی‌ها اعم از ۳۲ بیتی و ۶۴ بیتی).
            * ⚡ **RedCloud-${{ steps.get_version.outputs.VERSION }}-arm64-v8a.apk** : مخصوص گوشی‌های مدرن ۶۴ بیتی.
            * 📦 **RedCloud-${{ steps.get_version.outputs.VERSION }}-armeabi-v7a.apk** : مخصوص گوشی‌های قدیمی ۳۲ بیتی.
            
            ---
            ### ✨ تغییرات نسخه جدید:
            * 🚀 حل کامل مشکل باز شدن سایت‌ها و رفع بن‌بست DNS در حالت داشبورد
            * 🔋 پایداری دائمی و جلوگیری از قطع شدن اتصال با بستن برنامه از تسک منیجر (دکمه مربع)
            * 📱 پشتیبانی کامل از گوشی‌های ۳۲ بیتی برای تمام تب‌ها
            
            📢 **کانال اطلاع‌رسانی:** [@DevTaha_project](https://t.me/DevTaha_project)
          draft: false
          prerelease: false