name: Build and Release RedCloud Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "[*] Releasing version: ${TAG_NAME}"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download Official Tor GeoIP Databases
        run: |
          mkdir -p assets/tor
          echo "[*] Downloading official geoip database..."
          curl -sL "https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip" -o assets/tor/geoip
          echo "[*] Downloading official geoip6 database..."
          curl -sL "https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip6" -o assets/tor/geoip6
          ls -lh assets/tor/

      - name: Verify Project Assets
        run: |
          echo "[*] Verifying assets files..."
          ls -lh assets/
          [ -f "assets/cloudflare_IPs.txt" ] && echo "cloudflare_IPs.txt OK" || echo "Warning: cloudflare_IPs.txt missing"
          [ -f "assets/DNS.txt" ] && echo "DNS.txt OK" || echo "Warning: DNS.txt missing"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: |
          echo "[*] Building Universal APK..."
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p release_apks
          VERSION_TAG="${{ steps.get_version.outputs.VERSION }}"
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/RedCloud-${VERSION_TAG}-Universal.apk

      - name: Build ABI-Split APKs
        run: |
          echo "[*] Building Split-per-ABI APKs..."
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          VERSION_TAG="${{ steps.get_version.outputs.VERSION }}"
          
          # کپی و نام‌گذاری دقیق فایل‌های تفکیک‌شده معماری
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/RedCloud-${VERSION_TAG}-arm64-v8a.apk || true
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/RedCloud-${VERSION_TAG}-armeabi-v7a.apk || true
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ] && cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_apks/RedCloud-${VERSION_TAG}-x86_64.apk || true

      - name: Generate Checksums
        run: |
          cd release_apks
          sha256sum *.apk > SHA256SUMS.txt
          cd ..

      - name: Verify Release Artifacts
        run: |
          echo "[*] Final Generated Release Artifacts:"
          ls -lh release_apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "RedCloud VPN ${{ steps.get_version.outputs.VERSION }}"
          files: |
            release_apks/*.apk
            release_apks/SHA256SUMS.txt
          body: |
            ## 🛡️ انتشار نسخه جدید RedCloud VPN (${{ steps.get_version.outputs.VERSION }})
            
            ### 📥 راهنمای انتخاب فایل مناسب برای دانلود:
            * 📱 **RedCloud-${{ steps.get_version.outputs.VERSION }}-Universal.apk** : نسخه پیشنهادی و همه‌منظوره (قابل نصب روی ۱۰۰٪ تمامی گوشی‌ها).
            * ⚡ **RedCloud-${{ steps.get_version.outputs.VERSION }}-arm64-v8a.apk** : نسخه مخصوص گوشی‌های مدرن ۶۴ بیتی (کم‌حجم‌تر و بهینه‌تر).
            * 📦 **RedCloud-${{ steps.get_version.outputs.VERSION }}-armeabi-v7a.apk** : نسخه مخصوص گوشی‌های قدیمی‌تر ۳۲ بیتی.
            
            ---
            ### ✨ تغییرات این نسخه (Changelog):
            * 🚀 رفع باگ آی‌پی و اصلاح اتصال در حالت داشبورد
            * 🔋 حفظ پایداری ارتباط و جلوگیری از قطعی اتصال در پس‌زمینه (Background Stability)
            * 🛡️ به‌روزرسانی هسته‌های ضدسانسور Aether و Tor over MASQUE
            
            📢 **کانال اطلاع‌رسانی:** [@DevTaha_project](https://t.me/DevTaha_project)
          draft: false
          prerelease: false