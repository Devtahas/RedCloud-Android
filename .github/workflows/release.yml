name: Build and Release RedCloud Android

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Multi-Architecture APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download Official Tor GeoIP Databases
        run: |
          mkdir -p assets/tor
          echo "[*] Downloading official geoip database..."
          curl -sL "https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip" -o assets/tor/geoip
          echo "[*] Downloading official geoip6 database..."
          curl -sL "https://gitlab.torproject.org/tpo/core/tor/-/raw/main/src/config/geoip6" -o assets/tor/geoip6
          ls -lh assets/tor/

      - name: Verify Project Assets
        run: |
          echo "[*] Verifying assets files..."
          ls -lh assets/
          [ -f "assets/cloudflare_IPs.txt" ] && echo "cloudflare_IPs.txt OK" || echo "Warning: cloudflare_IPs.txt missing"
          [ -f "assets/DNS.txt" ] && echo "DNS.txt OK" || echo "Warning: DNS.txt missing"

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Universal APK
        run: |
          echo "[*] Building Universal APK..."
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Build ABI-Split APKs
        run: |
          echo "[*] Building Split-per-ABI APKs..."
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Organize Build Artifacts
        run: |
          mkdir -p release_apks
          # انتقال APK یونیورسال
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/RedCloud-Universal.apk
          
          # انتقال APKهای تفکیک شده معماری در صورت وجود
          [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ] && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/RedCloud-arm64-v8a.apk || true
          [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ] && cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_apks/RedCloud-armeabi-v7a.apk || true
          [ -f build/app/outputs/flutter-apk/app-x86_64-release.apk ] && cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_apks/RedCloud-x86_64.apk || true
          
          ls -lh release_apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false